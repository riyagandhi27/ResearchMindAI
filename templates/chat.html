<!DOCTYPE html>
<html>
<head>
    <title>RAG Chat</title>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: auto;
            background: #f5f5f5;
        }

        h2 {
            text-align: center;
        }

        #chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
        }

        .user {
            background: #dbeafe;
            padding: 10px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: right;
        }

        .bot {
            background: #dcfce7;
            padding: 10px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: left;
        }

        .input-area {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>RAG Chat System</h2>

<div id="chat-box"></div>

<div class="input-area">
    <input id="input" type="text" placeholder="Ask something...">
    <button onclick="send()">Send</button>
</div>

<script>
async function send() {

    let input = document.getElementById("input");
    let text = input.value.trim();

    if (!text) return;

    let chatBox = document.getElementById("chat-box");

    // show user message
    chatBox.innerHTML += `
    <div class="user">
        ${text}
    </div>
    `;
    input.value = "";

    // API call
    let res = await fetch("/chat_stream", {
        method: "POST",
        body: new URLSearchParams({ question: text })
    });

    if (!res.ok) {
        chatBox.innerHTML += `<p class="bot" style="color:red;">Server Error</p>`;
        return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let botText = "";

    // bot message container
    // bot message container
    let botDiv = document.createElement("div");
    botDiv.className = "bot";

    botDiv.textContent = "ResearchMind AI is thinking...";

    chatBox.appendChild(botDiv);

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        botText += decoder.decode(value, { stream: true });

        botDiv.textContent = "ResearchMind AI: " + botText;

        chatBox.scrollTop = chatBox.scrollHeight;
    }
}
</script>

</body>
</html>
